<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0C18">
<title>金曲猜歌王</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700;900&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════
   金曲猜歌王 — 視覺系統「深夜混音帶」

   只有 5 個色相。
   黃色 (--bottle) 只出現在兩種地方:主標題,以及得分 / 正解 / 達標。
   字體只有 Noto Serif TC 一個家族,層次靠字重不靠字級硬撐。
   明體橫畫細,深色底上小字會消失 —— 內文一律 500 起跳,九宮格 600。
   ═══════════════════════════════════════════════════════════ */

:root{
  color-scheme:dark;

  --night:#0B0C18;    /* 夜空:頁面底 */
  --deep:#171A33;     /* 海面下:表面 */
  --tide:#252C55;     /* 海面:可按的東西(九宮格) */
  --foam:#CFCAF0;     /* 前景文字 */
  --bottle:#F2C86A;   /* 漂流瓶的光 —— 得分 / 正解 / 達標 */
  --miss:#E08098;     /* 答錯 */

  --line:rgba(207,202,240,.16);
  --line-2:rgba(207,202,240,.32);
  --dim:rgba(207,202,240,.72);

  --face:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
  --w-title:900; --w-strong:700; --w-item:600; --w-body:500; --w-quiet:400;

  --t-display:clamp(2.6rem,13vw,3rem);
  --t-h1:2.25rem;
  --t-h2:1.688rem;
  --t-h3:1.266rem;
  --t-body:1rem;
  --t-small:.75rem;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  --r-touch:12px;
  --r-input:8px;

  --ease:cubic-bezier(.2,.8,.3,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--face);font-weight:var(--w-body);
  color:var(--foam);background:var(--night);
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;
  text-wrap:pretty;
}

/* 背景:夜空色往上微微透出一點海面的藍,不放圖 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(120% 60% at 50% 0%, var(--deep) 0%, var(--night) 70%);
}

.screen{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:max(var(--s6),env(safe-area-inset-top)) var(--s5)
          max(var(--s6),env(safe-area-inset-bottom));
  max-width:30rem;margin:0 auto;width:100%;
}
[hidden]{display:none !important}

.rule{height:1px;background:var(--line);flex:none}

button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{
  outline:2px solid var(--foam);outline-offset:3px;border-radius:var(--r-input);
}

/* 唯一的實心按鈕 */
.btn{
  display:block;width:100%;padding:var(--s4);
  background:var(--foam);color:var(--night);
  border-radius:var(--r-touch);
  font-weight:var(--w-strong);font-size:var(--t-h3);letter-spacing:.12em;
  transition:transform 120ms var(--ease),background 160ms var(--ease);
}
.btn:active{transform:translateY(1px);background:#B9B2E4}
.btn:disabled{background:rgba(207,202,240,.18);color:rgba(207,202,240,.4);cursor:not-allowed}
.btn.ghost{
  background:none;border:1px solid var(--line-2);
  color:var(--foam);font-weight:var(--w-body);
}
.btn.ghost:active{border-color:var(--foam);background:none}

/* ═══════════ 開始 ═══════════ */
#screen-start{justify-content:flex-end;gap:var(--s5)}
.brand h1{
  font-weight:var(--w-title);font-size:var(--t-display);
  line-height:1.14;letter-spacing:.04em;
  margin:var(--s2) 0 var(--s3);color:var(--bottle);
}

.label{flex:none;width:3rem;font-size:var(--t-small);color:var(--dim);font-weight:var(--w-quiet)}

.entry{display:flex;flex-direction:column;gap:var(--s4)}
.sound{display:flex;flex-direction:column;gap:var(--s4)}
.sound-row{display:flex;align-items:center;gap:var(--s4)}
.sound .txt{flex:1;min-width:0;font-size:var(--t-small);line-height:1.7;color:var(--dim)}
.sound .txt b{display:block;color:var(--foam);font-weight:var(--w-strong);font-size:var(--t-body)}
.sound button{
  flex:none;padding:var(--s2) var(--s4);
  border:1px solid var(--line-2);border-radius:var(--r-input);
  font-size:var(--t-small);
}
.sound.ok .txt b{color:var(--bottle)}
/* 只差測聲音的時候,把這一區點亮 —— 按鈕說「請先測試聲音」,要看得出來是哪裡 */
.sound.want{
  box-shadow:inset 2px 0 0 var(--bottle);
  padding-left:var(--s3);margin-left:calc(var(--s3) * -1);
  transition:box-shadow .25s var(--ease);
}

.volrow{display:flex;align-items:center;gap:var(--s4)}
.volslider{flex:1;min-width:0;height:22px;accent-color:var(--foam);cursor:pointer}
.volval{
  font-size:var(--t-small);color:var(--dim);
  min-width:2.8rem;text-align:right;font-variant-numeric:tabular-nums;
}
.volicon{
  width:16px;height:16px;flex:none;
  fill:var(--foam);stroke:var(--foam);stroke-width:1.6;stroke-linecap:round;
}
.volicon .w1,.volicon .w2{fill:none}
.volicon[data-level="0"] .w1,
.volicon[data-level="0"] .w2,
.volicon[data-level="1"] .w2{opacity:.2}

/* ═══════════ 載入 ═══════════ */
#screen-load{align-items:center;justify-content:center;text-align:center;gap:var(--s5)}
.spin{
  width:40px;height:40px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--foam);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#load-txt{max-width:20rem;font-size:var(--t-small);line-height:2.1;color:var(--dim)}
.load-retry{max-width:12rem}

/* ═══════════ 遊戲 ═══════════ */
#screen-play{height:100vh;height:100dvh;min-height:0;gap:var(--s4)}
/* position:relative 是音量面板的定位基準,拿掉的話面板會掉到頁面最底部 */
.hud{flex:none;display:flex;flex-direction:column;gap:var(--s4);position:relative}
.hud-top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4)}
.hud-top .q{font-size:var(--t-small);color:var(--dim);padding-bottom:var(--s2)}
/* 計時器是搶答遊戲的主角:靠字級與字重,不靠光暈 */
.hud-top .clock{
  font-weight:var(--w-title);font-size:var(--t-h1);line-height:1;
  font-variant-numeric:tabular-nums;
  min-width:4.2ch;text-align:right;   /* 固定寬,數字跳動不推版面 */
}
.hud-top .clock.hurry{color:var(--miss)}
.volbtn{
  flex:none;width:40px;height:40px;
  border:1px solid var(--line);border-radius:var(--r-input);
  display:flex;align-items:center;justify-content:center;
  transition:border-color 160ms var(--ease);
}
.volbtn[aria-expanded="true"]{border-color:var(--foam)}
.volpanel{
  position:absolute;top:100%;left:0;right:0;z-index:5;
  margin-top:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-input);
  background:var(--deep);box-shadow:inset 0 0 0 1px var(--line-2);
  display:flex;align-items:center;gap:var(--s4);
}

.bar{height:2px;background:var(--line);overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:100%;background:var(--foam);transform-origin:left center}
.bar i.hurry{background:var(--miss)}

/* 高螢幕上格子會被拉成細長條 —— 限高,並把多出來的空間留在上面。
   九宮格靠下,單手拿手機時拇指才構得到。 */
.grid{
  flex:1;min-height:0;margin-top:auto;
  max-height:calc(min(100vw, 30rem) * 1.5);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:var(--s2);
}
.opt{
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:var(--s2) var(--s1);
  background:var(--tide);border-radius:var(--r-touch);
  font-weight:var(--w-item);font-size:1.125rem;line-height:1.4;
  word-break:break-word;overflow:hidden;
  transition:transform 120ms var(--ease),opacity 200ms var(--ease),background 200ms var(--ease);
}
.opt.sm{font-size:1rem}
.opt.xs{font-size:.875rem;line-height:1.35}
.opt.xxs{font-size:.8125rem;line-height:1.3}
.opt:active{transform:scale(.96)}
/* 正解:整格反白填實 —— 不靠光暈,也不只靠顏色 */
.opt.right{background:var(--bottle);color:var(--night)}
.opt.wrong{background:none;box-shadow:inset 0 0 0 1px var(--miss);color:var(--miss)}
.opt.fade{opacity:.22}

/* 唯一一段編排好的動態:開場九宮格依序落下。
   fill-mode 必須是 backwards 不能是 both —— both 會在動畫結束後
   鎖住 opacity:1,蓋掉 JS 揭曉答案時加的 .fade。 */
@keyframes drop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid .opt{animation:drop 260ms var(--ease) backwards}
.grid .opt:nth-child(1){animation-delay:0ms}   .grid .opt:nth-child(2){animation-delay:40ms}
.grid .opt:nth-child(3){animation-delay:80ms}  .grid .opt:nth-child(4){animation-delay:60ms}
.grid .opt:nth-child(5){animation-delay:100ms} .grid .opt:nth-child(6){animation-delay:140ms}
.grid .opt:nth-child(7){animation-delay:120ms} .grid .opt:nth-child(8){animation-delay:160ms}
.grid .opt:nth-child(9){animation-delay:200ms}

.hud-bot{
  flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);
  font-size:var(--t-small);color:var(--dim);
}
.hud-bot b{font-weight:var(--w-strong);font-size:var(--t-h3);color:var(--bottle);font-variant-numeric:tabular-nums}

/* 舊版 white-space:nowrap 遇到長歌名會溢出畫面,改成可折行 */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--s5));
  width:min(calc(30rem - var(--s6)), calc(100vw - var(--s6)));
  transform:translateX(-50%);
  padding:var(--s3) var(--s4);border-radius:var(--r-input);
  background:var(--deep);box-shadow:inset 0 0 0 1px var(--line-2);
  font-size:var(--t-small);line-height:1.6;text-align:center;
  animation:rise .2s var(--ease);
}
.toast.good{color:var(--bottle)}
.toast.bad{color:var(--miss)}
@keyframes rise{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

/* ═══════════ 結算 ═══════════ */
#screen-result{justify-content:flex-end;gap:var(--s5)}
.scorecard .title{font-weight:var(--w-title);font-size:var(--t-h2);line-height:1.2;color:var(--foam)}
.scorecard .line{font-weight:var(--w-quiet);font-size:var(--t-small);line-height:1.9;color:var(--dim);margin-top:var(--s2)}
.scorecard .line:empty{display:none}
.scorecard .big{
  font-weight:var(--w-title);font-size:var(--t-display);line-height:1;
  color:var(--bottle);font-variant-numeric:tabular-nums;margin:var(--s4) 0 var(--s2);
}
.scorecard .meta{font-size:var(--t-small);color:var(--dim);font-weight:var(--w-quiet)}

/* 差幾分就能超過下一個人 —— 這是最好的「再玩一次」理由,所以給它亮色 */
.scorecard .next{
  margin-top:var(--s3);font-size:var(--t-small);line-height:1.8;
  color:var(--dim);font-weight:var(--w-quiet);
}
.scorecard .next b{color:var(--bottle);font-weight:var(--w-item)}

.misses{display:flex;flex-direction:column}
.misses h4{margin:0 0 var(--s3);font-size:var(--t-small);color:var(--dim);font-weight:var(--w-quiet)}
.misses ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.misses li{
  display:flex;justify-content:space-between;gap:var(--s4);
  padding:var(--s3) 0;border-top:1px solid var(--line);font-size:var(--t-small);
}
.misses li b{font-weight:var(--w-item);color:var(--foam)}
.misses li span{color:var(--dim)}
.misses .none{color:var(--bottle);font-size:var(--t-small)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}

/* ═══════════ 兩個模式 ═══════════
   按鈕裡塞第二行小字:上面是模式名,下面是「你目前最好到哪」——
   開始畫面要回答的問題是「我要玩哪一個」,那一行就是答案的依據。 */
.modes{display:flex;flex-direction:column;gap:var(--s3)}
.modes .btn{padding:var(--s3) var(--s4);line-height:1.35}
.modes .btn .t{display:block}
.modes .btn .sub{
  display:block;margin-top:2px;
  font-size:var(--t-small);font-weight:var(--w-quiet);letter-spacing:.02em;
  opacity:.72;
}
.modes .btn .sub:empty{display:none}

/* ═══════════ 闖關:遊戲中的關卡列 ═══════════
   曲庫變大是這個模式唯一的獎勵,但它看不見 —— 不寫在螢幕上,
   玩家只會覺得「怎麼突然一堆沒聽過的歌」。所以整局都掛著。 */
.hud-stage{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
  font-size:var(--t-small);line-height:1.4;
}
.hud-stage .lv{
  font-weight:var(--w-strong);color:var(--bottle);letter-spacing:.08em;flex:none;
}
.hud-stage .un{
  color:var(--dim);font-weight:var(--w-quiet);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hud-bot em{font-style:normal;color:var(--dim);font-weight:var(--w-quiet)}

/* ═══════════ 闖關:過關的彈框 ═══════════
   蓋在九宮格上面而不是切換到另一屏 —— 遊戲才像「暫停了一下」。
   動畫分兩段:底幕先暗下來,卡片再浮上來,解鎖那一行最後才到位。
   全部加起來不到半秒 —— 這是獎勵,不是過場,不能讓人等。 */
.pop{
  position:fixed;inset:0;z-index:40;
  display:flex;align-items:center;justify-content:center;padding:var(--s5);
  background:rgba(11,12,24,.72);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  opacity:0;transition:opacity .18s var(--ease);
}
.pop.in{opacity:1}
.pop-card{
  width:min(22rem,100%);
  padding:var(--s5);border-radius:var(--r-touch);
  background:var(--deep);box-shadow:inset 0 0 0 1px var(--line-2), 0 18px 48px rgba(0,0,0,.5);
  transform:translateY(14px) scale(.96);opacity:0;
}
.pop.in .pop-card{animation:popcard .34s var(--ease) .06s both}
@keyframes popcard{to{transform:none;opacity:1}}

.pop-card .tag{
  font-size:var(--t-small);font-weight:var(--w-item);
  color:var(--dim);letter-spacing:.22em;
}
.pop-card .big{
  margin:var(--s2) 0 0;
  font-weight:var(--w-title);font-size:var(--t-h2);line-height:1.25;color:var(--bottle);
}
.pop.in .pop-card .big{animation:poprise .36s var(--ease) .16s both}
@keyframes poprise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.pop-card .line{
  margin-top:var(--s3);font-size:var(--t-small);line-height:1.9;
  color:var(--dim);font-weight:var(--w-quiet);
}
.pop-card .line:empty{display:none}
.pop-card .facts{
  margin:var(--s4) 0 var(--s5);padding:0;list-style:none;
  display:flex;flex-direction:column;
}
.pop.in .pop-card .facts{animation:poprise .36s var(--ease) .24s both}
.pop-card .facts li{
  display:flex;justify-content:space-between;gap:var(--s4);align-items:baseline;
  padding:var(--s3) 0;border-top:1px solid var(--line);font-size:var(--t-small);
}
.pop-card .facts .k{color:var(--dim);font-weight:var(--w-quiet)}
.pop-card .facts .v{font-weight:var(--w-item);font-variant-numeric:tabular-nums;text-align:right}
.pop-card .facts .v.hot{color:var(--bottle)}
.pop-card .btn + .btn{margin-top:var(--s3)}

/* 六關全破:整張卡鑲一圈金邊,而且只有這一次會看到 */
.pop.clear .pop-card{box-shadow:inset 0 0 0 1px var(--bottle), 0 18px 48px rgba(0,0,0,.5)}
.pop.clear .pop-card .big{font-size:var(--t-h1)}

/* ═══════════ 競速:選主題 ═══════════ */
#screen-theme{gap:var(--s5)}
.theme-head h2{margin:0;font-weight:var(--w-title);font-size:var(--t-h2);color:var(--foam)}
.theme-head p{margin:var(--s2) 0 0;font-size:var(--t-small);color:var(--dim);font-weight:var(--w-quiet)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.theme{
  display:flex;flex-direction:column;align-items:flex-start;gap:var(--s1);
  padding:var(--s3) var(--s4);text-align:left;
  background:var(--tide);border-radius:var(--r-touch);
  transition:transform 120ms var(--ease);
}
.theme:active{transform:scale(.97)}
.theme .n{font-weight:var(--w-strong);font-size:var(--t-body)}
.theme .s{font-size:var(--t-small);color:var(--dim);font-weight:var(--w-quiet);font-variant-numeric:tabular-nums}
.theme .s b{color:var(--bottle);font-weight:var(--w-item)}
/* 「全部」是原本的競速模式,給它整列 */
.theme.wide{grid-column:1 / -1}
#screen-theme .btn.ghost{margin-top:auto}

@media (max-height:680px){
  .screen{padding-top:var(--s5);padding-bottom:var(--s5)}
  #screen-start,#screen-result{gap:var(--s4)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<!-- ═══════════ 開始 ═══════════ -->
<div class="screen" id="screen-start">
  <div class="brand">
    <h1>金曲猜歌王</h1>
  </div>

  <div class="rule"></div>

  <div class="entry">
    <div class="sound" id="sound">
    <div class="volrow">
      <span class="label">音量</span>
      <svg class="volicon" data-level="2" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.5h3L11 6v12L7 14.5H4z"/>
        <path class="w1" d="M14.5 9.4a3.8 3.8 0 0 1 0 5.2"/>
        <path class="w2" d="M17.2 7a7.3 7.3 0 0 1 0 10"/>
      </svg>
      <input class="volslider" type="range" id="vol-start" min="0" max="100" step="5" value="80" aria-label="音量">
      <span class="volval">80%</span>
    </div>

    <div class="sound-row">
      <span class="label">聲音</span>
      <div class="txt">
        <b>先測一下聲音</b>
        確定聽得到音效再開始！
      </div>
      <button type="button" id="btn-test">試聽</button>
    </div>
    </div>
  </div>

  <div class="rule"></div>

  <div class="modes">
    <button class="btn" id="btn-stage" disabled>
      <span class="t">闖關模式</span><span class="sub" id="stage-best"></span>
    </button>
    <button class="btn ghost" id="btn-speed" disabled>
      <span class="t">競速模式</span><span class="sub" id="speed-best"></span>
    </button>
  </div>
</div>

<!-- ═══════════ 競速:選主題 ═══════════ -->
<div class="screen" id="screen-theme" hidden>
  <div class="theme-head">
    <h2>選一個主題</h2>
    <p>十題,每題 12 秒,比分數</p>
  </div>
  <div class="themes" id="themes"></div>
  <button class="btn ghost" id="btn-theme-back">返回</button>
</div>

<!-- ═══════════ 闖關:過關的彈框 ═══════════
     刻意不做成一整屏 —— 蓋在九宮格上面,遊戲才像「暫停了一下」,
     而不是「跳到另一個畫面」。 -->
<div class="pop" id="pop" hidden>
  <div class="pop-card" role="dialog" aria-modal="true" aria-labelledby="st-big">
    <div class="tag" id="st-tag"></div>

  </div>
</div>
<script src="songs.js"></script>
<script src="decoys.js"></script>
<script src="previews.js"></script>
<script src="themes.js"></script>
<script>
/* ═══════════════════════════════════════════════════════
   金曲猜歌王
   完全不連線:題庫、干擾項、試聽網址全都是靜態檔,
   成績只存在玩家自己的手機裡。
   ═══════════════════════════════════════════════════════ */

const CONFIG = {
  questionCount: 10,      // 每局題數
  // 保底配額:這幾個曲風每局至少抽這麼多首,配額之內隨機
  quota: { mando: 5, classic: 1, tw: 1 },
  // 非中文(kpop/west/jp)保底題數 —— 三種語言混在一起抽,不指定是哪一種。
  // 保底之外剩下的名額從全部歌曲隨機補,所以非中文有機會不只這一題。
  foreignMin: 1,
  optionCount: 9,
  timeLimit: 12,          // 每題秒數
  baseScore: 300,         // 答對底分
  speedScore: 700,        // 速度分上限(300+700=1000,10 題滿分 10000)
  revealMs: 2200,         // 顯示答案的停頓
  clipSeconds: 15,        // 音檔片段長度
  maxSameArtist: 2        // 同一歌手在九格中最多出現幾次
};
const FOREIGN_GENRES = ['kpop', 'west', 'jp'];

const $ = id => document.getElementById(id);
/* ---------- 闖關模式的關卡表 ----------

   難度靠兩件事疊上去:曲庫變大(而且越後面越冷門),門檻變高。
   秒數跟競速模式一樣是 12 秒,每一關都一樣 —— 兩個模式的分數才能互相對照,
   而且玩家感覺得到「是題目變難了」,不是「我被偷偷加速了」。

   每關 10 題、滿分 10,000,分數每關獨立算。沒過就從第 1 關重來。

   unlocked 是「進到這一關才開放的東西」,會在上一關的過關畫面上公布 ——
   解鎖的當下要看得到自己解鎖了什麼,不然曲庫變大玩家只會覺得變難而已。 */
const STAGE_SECONDS = 12;
const STAGE_QUESTIONS = 10;
const STAGES = [
  { need: 4000, genres: ['mando','classic'] },
  { need: 5000, genres: ['mando','classic','tw'],                     unlocked: '台語' },
  { need: 6000, genres: ['mando','classic','tw','west'],              unlocked: '西洋' },
  { need: 7000, genres: ['mando','classic','tw','west','kpop','jp'],  unlocked: '韓文 · 日文' },
  { need: 8000, genres: ['mando','classic','tw','west','kpop','jp'] },
  { need: 9000, genres: ['mando','classic','tw','west','kpop','jp'] }
];

/* 遊戲進行中一直掛在最上面的那一列:你在第幾關、目前為止解鎖了什麼。
   曲庫變大是這個模式唯一的獎勵,但它是看不見的 —— 不寫出來,
   玩家只會覺得「怎麼突然一堆沒聽過的歌」。 */
function stageHudLabel(n){
  // 全開之後就不要再一項一項唸了 —— 那一列只有一行,唸完會被切掉
  if(stagePool(n).length >= (window.SONGS || []).length) return '全曲庫開放';
  const got = STAGES.slice(0, n).map(st => st.unlocked).filter(Boolean);
  return got.length ? '已解鎖 ' + got.join(' · ') : '華語現代 · 經典';
}

function stagePool(n){
  const g = STAGES[n - 1].genres;
  return (window.SONGS || []).filter(s => g.includes(s.genre));
}

/* ---------- 競速模式的主題 ----------

   「全部」就是原本的競速模式:只出 songs.js 那 340 首,套曲風配額。
   其他主題從 songs.js + themes.js(Apple Music 歌單匯入的)合起來的曲庫裡篩,不套配額。
   年代用的 year 是商店標的發行年,只是大概 —— 所以年代主題只收華語和台語,
   不然會被一大堆年份不準的日本動畫歌灌滿。
   曲庫少於 MIN_THEME_SONGS 首的主題不顯示。 */
const MIN_THEME_SONGS = 30;
const ZH = ['mando', 'classic', 'tw'];
const hasTag = (s, t) => (s.tags || []).includes(t);
const THEMES = [
  { key: 'all',    name: '全部',       test: null },
  { key: 'zh',     name: '中文',       test: s => s.genre === 'mando' || s.genre === 'classic' },
  { key: 'tw',     name: '台語',       test: s => s.genre === 'tw' },
  { key: 'west',   name: '西洋',       test: s => s.genre === 'west' },
  { key: 'kpop',   name: '韓文',       test: s => s.genre === 'kpop' },
  { key: 'jp',     name: '日文',       test: s => s.genre === 'jp' },
  { key: 'tiktok', name: '抖音歌',     test: s => hasTag(s, 'tiktok') },
  { key: 'ost',    name: '動漫 · 影視', test: s => hasTag(s, 'ost') },
  { key: 'old',    name: '經典老歌',   test: s => ZH.includes(s.genre) && (s.genre === 'classic' || (s.year && s.year < 2000)) },
  { key: 'y2000',  name: '2000 年代',  test: s => ZH.includes(s.genre) && s.year >= 2000 && s.year < 2010 },
  { key: 'y2010',  name: '2010 年代',  test: s => ZH.includes(s.genre) && s.year >= 2010 && s.year < 2020 },
];

// 把 themes.js 查到的 year / tags 掛到每首歌身上
const EXTRA_SONGS = window.EXTRA_SONGS || [];
(window.SONGS || []).concat(EXTRA_SONGS).forEach(s => Object.assign(s, (window.SONG_META || {})[s.id]));
const ALL_SONGS = (window.SONGS || []).concat(EXTRA_SONGS);

function themeByKey(key){ return THEMES.find(t => t.key === key) || THEMES[0]; }
function themePool(theme){ return theme.test ? ALL_SONGS.filter(theme.test) : (window.SONGS || []); }

// 這一局實際跑的規則。開局時依模式填,遊戲迴圈只看這個,不看 CONFIG。
const R = { questionCount: CONFIG.questionCount, timeLimit: CONFIG.timeLimit };

const SCREENS = ['screen-start','screen-theme','screen-load','screen-play','screen-result'];
function show(id){
  SCREENS.forEach(s => $(s).hidden = (s !== id));
  window.scrollTo(0,0);
}

/* ---------- 小工具 ---------- */
const shuffle = arr => {
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
};
const hashCode = str => { let h=0; for(const ch of str) h=(h*31+ch.charCodeAt(0))|0; return h; };
const seeded = seed => { let s=seed>>>0; return () => { s=(s*1664525+1013904223)>>>0; return s/4294967296; }; };
const midiToFreq = m => 440 * Math.pow(2,(m-69)/12);

/* ---------- 音訊 ---------- */
let audioCtx = null;
function ensureCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

/* ---------- 音量 ---------- */
// 記在 localStorage,同一支手機再玩不用重調。
const VOL_KEY = 'pmsg_volume_v1';
let volume = 0.8;
try{
  const v = parseFloat(localStorage.getItem(VOL_KEY));
  if(v >= 0 && v <= 1) volume = v;
}catch(e){}

function setVolume(v){
  volume = Math.min(1, Math.max(0, v));
  try{ localStorage.setItem(VOL_KEY, String(volume)); }catch(e){}

  // 已經備好的音源、正在播的合成音都要即時跟著變
  (G.questions || []).forEach(q => { if(q.audio && q.audio.el) q.audio.el.volume = volume; });
  if(G.clip && G.clip.setVolume) G.clip.setVolume(volume);

  const pct = Math.round(volume * 100);
  document.querySelectorAll('.volslider').forEach(el => { if(+el.value !== pct) el.value = pct; });
  document.querySelectorAll('.volval').forEach(el => { el.textContent = pct + '%'; });
  document.querySelectorAll('.volicon').forEach(el => {
    el.dataset.level = volume === 0 ? '0' : volume < 0.5 ? '1' : '2';
  });
}

// 試著載入一個音訊來源,載不動就回 null。
//
// 判定用 canplay / loadeddata,不用 canplaythrough ——
// canplaythrough 要整段緩衝到「保證不會斷」才觸發,八首歌同時下載
// (每首約 1MB)在校園網路下常常超過逾時,結果整局退回示範音。
// 只要 metadata 到手就代表這個來源有效,剩下的邊播邊緩衝。
function probeAudio(src, timeoutMs){
  return new Promise(resolve => {
    const a = new Audio(src);
    a.preload = 'metadata';   // 只探測,不整首抓下來;選定之後才改成 auto 預先緩衝
    let settled = false;
    const ok = () => { if(!settled){ settled = true; resolve(a); } };
    const no = () => { if(!settled){ settled = true; resolve(null); } };
    a.addEventListener('canplay', ok, {once:true});
    a.addEventListener('loadeddata', ok, {once:true});
    a.addEventListener('loadedmetadata', ok, {once:true});
    a.addEventListener('error', no, {once:true});
    setTimeout(no, timeoutMs);
    a.load();
  });
}

// 音源優先順序:本地音檔 → Apple 官方試聽(串流,不落地)→ 合成示範音
//
// 一次只準備一首。不要開場就把十題全部探測 ——
// 同時建立十幾個 audio 元素會讓 Chrome 的媒體載入全部卡在 stalled,
// 結果整局默默退回示範音。單獨一個載入只要 70 毫秒,十六個一起就死。
let hasLocalAudio = null;   // null = 還沒試過,false = audio/ 是空的,之後不再浪費請求

async function prepareClip(q, remoteTimeout = 12000){
  if(q.audio !== undefined) return q.audio;   // 已經備好或已確定沒有
  const song = q.song;

  let el = null, source = null, offset = 0;

  if(hasLocalAudio !== false){
    el = await probeAudio(`audio/${song.id}.m4a`, 2500);
    if(el){ hasLocalAudio = true; source = 'local'; }
    else if(hasLocalAudio === null) hasLocalAudio = false;   // 第一首就沒有,整個資料夾當作空的
  }

  if(!el){
    const p = (window.SONG_PREVIEWS || {})[song.id];
    if(p && p.url){
      el = await probeAudio(p.url, remoteTimeout);
      if(el){ source = 'preview'; offset = p.offset || 0; }
    }
  }

  if(el){ el.volume = volume; el.preload = 'auto'; try{ el.load(); }catch(e){} }   // 選定後才預先緩衝
  q.audio = el ? { el, source, offset } : null;
  return q.audio;
}

function note(ctx, dest, freq, at, dur, type, peak){
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  osc.connect(g); g.connect(dest);
  osc.start(at); osc.stop(at + dur + 0.05);
  return osc;
}

// 依歌曲 id 產生固定的示範旋律(同一首歌每次都一樣)
function synthClip(song, seconds){
  const ctx = ensureCtx();
  if(!ctx) return { stop(){} };
  const rnd = seeded(hashCode(song.id));
  const master = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 2400;
  master.connect(filter); filter.connect(ctx.destination);
  master.gain.setValueAtTime(volume, ctx.currentTime);

  const scale = [0,2,4,7,9,12,14,16,19];
  const root = 45 + Math.floor(rnd()*8);
  const beat = 60 / (80 + Math.floor(rnd()*45));
  const t0 = ctx.currentTime + 0.06;
  const oscs = [];
  let t = t0, i = 0;
  while(t < t0 + seconds){
    oscs.push(note(ctx, master, midiToFreq(root+12+scale[Math.floor(rnd()*scale.length)]), t, beat*0.85, 'triangle', 0.16));
    if(i % 2 === 0) oscs.push(note(ctx, master, midiToFreq(root), t, beat*1.5, 'sine', 0.22));
    t += beat*0.5; i++;
  }
  let stopped = false;
  return {
    stop(){
      stopped = true;
      const now = ctx.currentTime;
      try{
        master.gain.cancelScheduledValues(now);
        master.gain.setValueAtTime(master.gain.value, now);
        master.gain.linearRampToValueAtTime(0.0001, now + 0.08);
      }catch(e){}
      oscs.forEach(o => { try{ o.stop(now + 0.1); }catch(e){} });
    },
    // 停掉之後就別再理音量,不然滑桿會把已經收掉的聲音拉回來
    setVolume(v){ if(stopped) return; try{ master.gain.setTargetAtTime(v, ctx.currentTime, 0.02); }catch(e){} }
  };
}

// 瀏覽器擋掉播放時(iOS 側邊靜音鍵、頁面失去使用者互動狀態)不要默默無聲。
// 倒數照跑、畫面不報錯、玩家安靜地猜完一題,是最糟的失敗方式。
function onPlayBlocked(q){
  $('playmeta').textContent = '沒有聲音?點一下畫面';
  const retry = () => {
    ensureCtx();
    const el = q.audio && q.audio.el;
    if(el) el.play().then(() => { $('playmeta').textContent = ''; }).catch(() => {});
  };
  document.addEventListener('pointerdown', retry, { once: true });
}

function playClip(q){
  if(q.audio && q.audio.el){
    try{
      q.audio.el.volume = volume;
      q.audio.el.currentTime = q.audio.offset || 0;
      const p = q.audio.el.play();
      if(p && p.catch) p.catch(() => onPlayBlocked(q));
      return { stop(){ try{ q.audio.el.pause(); }catch(e){} } };
    }catch(e){ onPlayBlocked(q); }
  }
  return synthClip(q.song, CONFIG.clipSeconds);
}

/* ---------- 成績 ---------- */

// 成績只存在這支手機裡,用來顯示「你的最佳成績」。
const Store = {
  KEY: 'pmsg_scores_v1',

  all(){
    try{ return JSON.parse(localStorage.getItem(this.KEY)) || []; }
    catch(e){ return []; }
  },

  save(entry){
    const list = this.all();
    list.push(entry);
    // 只留最近 50 局 —— 再多也沒人看,而且 localStorage 有大小上限
    try{ localStorage.setItem(this.KEY, JSON.stringify(list.slice(-50))); }catch(e){}
  },

  /* 「你的最佳」只認競速模式的分數,而且每個主題分開算 —— 主題難度差很多。
     闖關某一關的分數不能拿來比 —— 第 1 關只有華語 226 首,比全庫好猜太多。
     舊紀錄沒有 mode / theme 欄位,那是還沒有闖關模式和主題以前存的,一律算競速的「全部」。 */
  best(theme = 'all'){
    return this.all().reduce((m, r) =>
      r.mode === 'stage' || (r.theme || 'all') !== theme ? m : Math.max(m, r.score || 0), 0);
  },
  plays(){ return this.all().length; },

  // 闖關模式的最高紀錄。只會往上,不會因為這次玩爛而掉下來
  STAGE_KEY: 'pmsg_stage_v1',
  bestStage(){
    try{ return Number(localStorage.getItem(this.STAGE_KEY)) || 0; }catch(e){ return 0; }
  },
  noteStage(n){
    if(n > this.bestStage()){ try{ localStorage.setItem(this.STAGE_KEY, String(n)); }catch(e){} }
  }
};

/* ---------- 出題 ---------- */

// 顯示用的歌名:去掉「(電影《⋯》主題曲)」這類副標。
// 答案的歌名是手寫的、本來就乾淨,干擾項來自 Apple 商店常帶副標 ——
// 兩邊不統一的話,玩家會發現「沒有括號的那格就是答案」。
function cleanTitle(t){
  const s = String(t || '')
    .replace(/\s*[（(【\[].*$/, '')   // 「(電影《⋯》主題曲)」「(movie ver.)」
    .replace(/\s+[-–—]\s+.*$/, '')    // 「 - A Rock Can Be A Star」「 - Single Version」
    .trim();                          // 破折號前後都要有空白,才不會誤砍 DDU-DU DDU-DU
  return s || String(t || '');
}

// 九宮格去重用的鍵。要壓成小寫 —— 「HAPPY / DAY6」和「Happy / Pharrell Williams」
// 是兩首不同的歌,但同時出現在一題裡,螢幕上長得一模一樣,玩家只會覺得出題出錯。
function titleKey(t){ return cleanTitle(t).toLowerCase(); }

// 依歌名長度決定字級,九格必須一屏看完、不能捲動
function sizeClass(label){
  const cjk = /[㐀-鿿぀-ヿ]/.test(label);
  const n = label.length;
  if(cjk ? n >= 11 : n >= 20) return ' xxs';
  if(cjk ? n >= 9  : n >= 14) return ' xs';
  if(cjk ? n >= 6  : n >= 9)  return ' sm';
  return '';
}

// 選項池 = 題庫裡的歌 + 歌單匯入的歌 + 純干擾歌名
function optionPool(){
  return ALL_SONGS.concat(window.DECOYS || []);
}

/* songs  這一局可以出的歌(闖關模式只給該關解鎖的曲庫)
   quota  要不要套曲風配額。競速模式要(每局都要有台語、經典、非中文);
          闖關模式不要 —— 那一關的曲庫就是它的難度,再塞配額會打亂設計 */
function buildQuestions(songs, quota){
  songs = songs || window.SONGS || [];

  // 抽題分三步:固定配額 → 非中文保底 → 剩下的名額自由補
  // 同名的歌一局只出一首 —— 歌單匯入的曲庫裡,同一首歌可能掛著兩種寫法的歌手名
  const picked = [], pickedTitle = new Set();
  const take = (list, n) => {
    for(const s of shuffle(list)){
      if(n <= 0) break;
      const key = titleKey(s.title);
      if(picked.includes(s) || pickedTitle.has(key)) continue;
      picked.push(s); pickedTitle.add(key); n--;
    }
  };

  if(quota){
    // 1. 各曲風的保底配額
    for(const [genre, n] of Object.entries(CONFIG.quota)){
      take(songs.filter(s => s.genre === genre), n);
    }
    // 2. 非中文保底:韓/西洋/日文混在一起抽,不保證是哪一種語言
    take(songs.filter(s => FOREIGN_GENRES.includes(s.genre)), CONFIG.foreignMin);
  }
  // 3. 剩下的名額從全部歌曲隨機補 —— 非中文也在池子裡,所以可能不只保底那一題。
  //    某個曲風的歌不夠湊到配額時,也是靠這一步補滿題數。
  take(songs, R.questionCount - picked.length);
  const answers = shuffle(picked);   // 出題順序也打亂,不然每局都是同樣的曲風順序

  const pool = optionPool();
  let lastIndex = -1;

  return answers.map(answer => {
    const options = [answer];
    const usedTitle = new Set([titleKey(answer.title)]);
    const byArtist = { [answer.artist]: 1 };

    // 干擾項先挑同 genre 的 —— 華語歌就配華語選項。
    // 混進一堆英文歌名的話,玩家用刪去法就猜到了,九選一的難度會垮。
    const passes = [
      { list: pool.filter(o => o.genre === answer.genre), max: CONFIG.maxSameArtist },
      { list: pool, max: CONFIG.maxSameArtist },
      { list: pool, max: Infinity }
    ];
    for(const pass of passes){
      if(options.length >= CONFIG.optionCount) break;
      for(const o of shuffle(pass.list)){
        if(options.length >= CONFIG.optionCount) break;
        const key = titleKey(o.title);
        if(usedTitle.has(key)) continue;
        if((byArtist[o.artist] || 0) >= pass.max) continue;
        usedTitle.add(key);
        byArtist[o.artist] = (byArtist[o.artist] || 0) + 1;
        options.push(o);
      }
    }

    const grid = shuffle(options);
    // 正確答案不連續兩題落在同一格
    let idx = grid.indexOf(answer);
    if(idx === lastIndex && grid.length > 1){
      const swap = (idx + 1 + Math.floor(Math.random()*(grid.length-1))) % grid.length;
      [grid[idx], grid[swap]] = [grid[swap], grid[idx]];
      idx = swap;
    }
    lastIndex = idx;
    // audio 刻意不設值:prepareClip 用 undefined 判斷「還沒準備過」,
    // 這裡若寫成 null 會被當成「已確定沒有音源」而直接跳過探測
    return { song: answer, options: grid };
  });
}

/* ---------- 遊戲狀態 ---------- */
const G = {
  questions: [], index: 0, total: 0, log: [],
  mode: 'speed', stage: 1, theme: 'all',
  soundOk: false, timer: null, clip: null, deadline: 0, locked: false
};

/* ---------- 開始畫面 ---------- */

// 按鈕變灰卻不說原因,是這個畫面最容易卡住玩家的地方 ——
// 所以按鈕上永遠寫著「還差什麼」。
function refreshStartBtn(){
  const why = !G.soundOk ? '請先測試聲音' : null;

  for(const [id, label] of [['btn-speed','競速模式'], ['btn-stage','闖關模式']]){
    $(id).disabled = !!why;
    $(id).querySelector('.t').textContent = why || label;
  }
  const bestStage = Store.bestStage();
  $('stage-best').textContent = why ? ''
    : (bestStage ? `最佳紀錄 第 ${bestStage} 關` : '六關,一關比一關難');
  $('speed-best').textContent = why ? '' : '選主題,十題比分數';

  // 還沒測聲音時,把視線引到聲音那一區
  $('sound').classList.toggle('want', !G.soundOk);
}

$('btn-test').addEventListener('click', () => {
  const ctx = ensureCtx();
  if(!ctx){
    alert('這支瀏覽器不支援音訊播放,請換一個瀏覽器開啟。');
    return;
  }
  // 音量被拉到 0 還按試聽,會以為壞掉 —— 先拉回一半
  if(volume === 0) setVolume(0.5);

  // 一段短暫的上行琶音,同時解開手機的音訊播放限制
  const t = ctx.currentTime + 0.05;
  [0,4,7,12].forEach((semi,i) =>
    note(ctx, ctx.destination, midiToFreq(69+semi), t + i*0.13, 0.3, 'triangle', 0.2 * volume));
  G.soundOk = true;
  $('sound').classList.add('ok');
  $('sound').querySelector('b').textContent = '聲音沒問題!';
  $('btn-test').textContent = '再聽一次';
  refreshStartBtn();
});

/* ---------- 音量控制 ---------- */
document.querySelectorAll('.volslider').forEach(el =>
  el.addEventListener('input', e => setVolume(e.target.value / 100)));

$('btn-vol').addEventListener('click', () => {
  const panel = $('volpanel');
  const opening = panel.hidden;
  panel.hidden = !opening;
  $('btn-vol').setAttribute('aria-expanded', String(opening));
});

function renderThemes(){
  $('themes').innerHTML = '';
  for(const theme of THEMES){
    const n = themePool(theme).length;
    if(n < MIN_THEME_SONGS) continue;
    const best = Store.best(theme.key);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'theme' + (theme.key === 'all' ? ' wide' : '');
    b.innerHTML = `<span class="n">${theme.name}</span>`
      + `<span class="s">${n.toLocaleString()} 首${best ? ` · 最佳 <b>${best.toLocaleString()}</b>` : ''}</span>`;
    b.addEventListener('click', () => startGame('speed', theme.key));
    $('themes').appendChild(b);
  }
  show('screen-theme');
}

$('btn-speed').addEventListener('click', renderThemes);
$('btn-stage').addEventListener('click', () => startGame('stage'));
$('btn-theme-back').addEventListener('click', () => show('screen-start'));
$('btn-again').addEventListener('click', () => startGame(G.mode, G.theme));
$('btn-home').addEventListener('click', () => show('screen-start'));

/* ---------- 開局 ---------- */

// 載入第一首。網路慢就等 —— 但要讓人看到在等什麼。
// 默默改播示範音是最糟的選項:畫面不報錯,玩家整局猜不出來。
async function loadFirst(){
  const q = G.questions[0];
  q.audio = undefined;                 // 重試時要重新探測
  $('load-spin').hidden = false;
  $('btn-retry').hidden = true;
  $('load-txt').textContent = '正在準備第一首⋯';

  const t0 = Date.now();
  const ticker = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    if(s >= 10)     $('load-txt').textContent = `網路好像不太順,還在等⋯(${s} 秒)`;
    else if(s >= 4) $('load-txt').textContent = '網路好像有點慢,再等一下⋯';
  }, 1000);

  const clip = await prepareClip(q, 25000);   // 開場給到 25 秒,慢總比默默降級好
  clearInterval(ticker);
  if(clip) return true;

  $('load-spin').hidden = true;
  $('load-txt').innerHTML = '載不到音樂 —— 可能是網路不通。<br>確認一下網路,或換個網路再試一次。';
  $('btn-retry').hidden = false;
  return false;
}

$('btn-retry').addEventListener('click', async () => {
  if(await loadFirst()){ show('screen-play'); nextQuestion(); }
});

async function startGame(mode, theme = 'all'){
  G.mode = mode;
  G.theme = theme;
  G.stage = 1;
  await playRound();
}

/* 一局(競速模式的十題,或闖關模式的一關)。兩個模式差在規則和曲庫,
   之後的流程 —— 載入、出題、計時、計分 —— 完全共用。 */
async function playRound(){
  if(G.mode === 'stage'){
    Object.assign(R, { questionCount: STAGE_QUESTIONS, timeLimit: STAGE_SECONDS });
    G.questions = buildQuestions(stagePool(G.stage), false);
    $('hud-lv').textContent = `第 ${G.stage} 關`;
    $('hud-un').textContent = `${stageHudLabel(G.stage)} · ${stagePool(G.stage).length} 首`;
    $('goal').textContent = ` / ${STAGES[G.stage - 1].need.toLocaleString()}`;
  }else{
    Object.assign(R, { questionCount: CONFIG.questionCount, timeLimit: CONFIG.timeLimit });
    const theme = themeByKey(G.theme);
    const pool = themePool(theme);
    G.questions = buildQuestions(pool, theme.key === 'all');
    $('hud-lv').textContent = theme.name;
    $('hud-un').textContent = `${pool.length.toLocaleString()} 首`;
    $('goal').textContent = '';
  }
  G.index = 0; G.total = 0; G.log = [];

  show('screen-load');
  if(!await loadFirst()) return;   // 載不到就停在載入畫面讓玩家重試,不要硬開局

  show('screen-play');
  nextQuestion();
}

async function nextQuestion(){
  const q = G.questions[G.index];
  G.locked = true;                       // 音源還沒備好之前不接受作答

  // 音量面板蓋在九宮格上方,換題時收起來,免得擋住選項
  $('volpanel').hidden = true;
  $('btn-vol').setAttribute('aria-expanded', 'false');

  $('qnum').textContent = `第 ${G.index+1} 題,共 ${R.questionCount} 題`;
  $('running').textContent = G.total.toLocaleString();
  $('clock').textContent = R.timeLimit.toFixed(1);
  $('clock').classList.remove('hurry');
  $('barfill').style.transform = 'scaleX(1)';
  $('barfill').classList.remove('hurry');

  const grid = $('grid');
  grid.innerHTML = '';
  q.options.forEach((opt, i) => {
    const label = cleanTitle(opt.title);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + sizeClass(label);
    b.textContent = label;
    b.addEventListener('click', () => answer(opt, i));
    grid.appendChild(b);
  });

  if(q.audio === undefined) $('playmeta').textContent = '載入中⋯';   // 預抓還沒完成才會看到
  await prepareClip(q);
  $('playmeta').textContent = q.audio ? '' : '示範音 · 這首找不到音源';

  if(G.clip) G.clip.stop();
  G.clip = playClip(q);

  G.locked = false;
  G.deadline = performance.now() + R.timeLimit * 1000;
  tick();

  // 這一題在播的時候,把下一題的音源先抓好,換題才不會停頓
  const nx = G.questions[G.index + 1];
  if(nx) prepareClip(nx);
}

function tick(){
  const left = Math.max(0, (G.deadline - performance.now()) / 1000);
  const ratio = left / R.timeLimit;
  $('clock').textContent = left.toFixed(1);
  $('clock').classList.toggle('hurry', left <= 4);
  $('barfill').style.transform = `scaleX(${ratio})`;
  $('barfill').classList.toggle('hurry', left <= 4);

  if(left <= 0){ answer(null, -1); return; }
  G.timer = requestAnimationFrame(tick);
}

function answer(opt, index){
  if(G.locked) return;
  G.locked = true;
  cancelAnimationFrame(G.timer);
  if(G.clip) G.clip.stop();

  const q = G.questions[G.index];
  const left = Math.max(0, (G.deadline - performance.now()) / 1000);
  const correct = opt === q.song;
  const gained = correct
    ? Math.round(CONFIG.baseScore + CONFIG.speedScore * (left / R.timeLimit))
    : 0;

  G.total += gained;
  G.log.push({ song: q.song, correct, gained, seconds: +(R.timeLimit - left).toFixed(1) });

  // 標出正解,淡掉其他選項
  const rightIndex = q.options.indexOf(q.song);
  [...$('grid').children].forEach((el, i) => {
    if(i === rightIndex) el.classList.add('right');
    else if(i === index) el.classList.add('wrong');
    else el.classList.add('fade');
  });
  $('running').textContent = G.total.toLocaleString();

  const t = document.createElement('div');
  t.className = 'toast ' + (correct ? 'good' : 'bad');
  t.textContent = correct
    ? `答對了,${q.song.title} +${gained} 分`
    : (opt ? `答錯了。這首是${q.song.artist}的〈${q.song.title}〉`
           : `時間到。這首是${q.song.artist}的〈${q.song.title}〉`);
  document.body.appendChild(t);

  setTimeout(() => {
    t.remove();
    G.index++;
    if(G.index >= R.questionCount) finish();
    else nextQuestion();
  }, CONFIG.revealMs);
}

/* ---------- 結算 ---------- */

/* ╔══════════════════════════════════════════════════════════════╗
   ║  稱號與結語 —— 要改文字改這張表就好,底下的程式不用動         ║
   ╚══════════════════════════════════════════════════════════════╝

   min   門檻分數。由上往下比,第一個「分數 >= min」的就是他的稱號。
         滿分 10000(10 題 × 1000)。
   title 稱號。玩家會截圖傳出去的就是這行,所以短一點、好唸一點。
   line  稱號底下那句話。想留白就寫成空字串 ''。

   想多一個或少一個級距,直接加減這張表的列,程式會自己跟上。
   最後一列的 min 一定要是 0 —— 那是所有人都符合的保底。 */

const TITLES = [
  { min: 8000, title: '金曲猜歌王',   line: '' },
  { min: 6767, title: '金曲點唱機',   line: '' },
  { min: 5000, title: '移動 KTV',    line: '' },
  { min: 3000, title: '持續聽歌中',   line: '' },
  { min: 0,    title: '聽歌小萌新',   line: '' },
];

function titleFor(score){
  return TITLES.find(t => score >= t.min) || TITLES[TITLES.length - 1];
}

function finish(){
  if(G.mode === 'stage') return finishStage();

  const entry = {
    mode: 'speed',
    theme: G.theme,
    score: G.total,
    correct: G.log.filter(r => r.correct).length,
    at: Date.now()
  };
  const prevBest = Store.best(G.theme);
  Store.save(entry);
  $('btn-again').textContent = '再玩一次';

  const rank = titleFor(G.total);
  $('res-title').textContent = rank.title;
  $('res-line').textContent  = rank.line;
  $('res-score').textContent = G.total.toLocaleString();
  $('res-meta').textContent  = `${themeByKey(G.theme).name} · 答對 ${entry.correct} 題,共 ${R.questionCount} 題`;

  const nextEl = $('res-next');
  nextEl.innerHTML = prevBest && G.total > prevBest
    ? `這支手機的新紀錄(上次最好 ${prevBest.toLocaleString()} 分)`
    : '';
  nextEl.hidden = !nextEl.innerHTML;

  // 答錯的歌
  const missed = G.log.filter(r => !r.correct);
  $('res-misses').innerHTML = missed.length
    ? `<h4>沒答出來的</h4><ul>${missed.map(r =>
        `<li><b>${r.song.title}</b><span>${r.song.artist}</span></li>`).join('')}</ul>`
    : `<h4>全對</h4><div class="none">十題全中,一首都沒漏</div>`;

  show('screen-result');
}

/* ---------- 闖關模式的結算 ---------- */

function stageFacts(st, passed){
  const rows = [
    [`這一關`, `${G.total.toLocaleString()} / ${st.need.toLocaleString()} 分`, passed]
  ];
  const next = STAGES[G.stage];
  if(passed && next){
    if(next.unlocked){
      const before = stagePool(G.stage).length, after = stagePool(G.stage + 1).length;
      rows.push([`解鎖`, `${next.unlocked} ${after - before} 首 · 曲庫 ${before} → ${after}`, true]);
    }else{
      rows.push([`曲庫`, `${stagePool(G.stage + 1).length} 首,已經全開`, true]);
    }
    rows.push([`第 ${G.stage + 1} 關`, `要 ${next.need.toLocaleString()} 分`, false]);
  }
  return rows.map(([k, v, hot]) =>
    `<li><span class="k">${k}</span><span class="v${hot ? ' hot' : ''}">${v}</span></li>`).join('');
}

function finishStage(){
  const st = STAGES[G.stage - 1];
  const passed = G.total >= st.need;
  const cleared = passed ? G.stage : G.stage - 1;   // 真正過掉的關數
  Store.noteStage(cleared);
  Store.save({ mode: 'stage', stage: cleared, score: G.total, at: Date.now() });

  if(!passed) return failStage(st);

  const last = G.stage >= STAGES.length;
  const pop = $('pop');
  pop.classList.toggle('clear', last);
  $('st-tag').textContent  = last ? '全部破關' : `第 ${G.stage} 關 通過`;
  $('st-big').textContent  = last ? '六關全破'
    : (STAGES[G.stage].unlocked ? `解鎖 ${STAGES[G.stage].unlocked}` : `前往第 ${G.stage + 1} 關`);
  $('st-line').textContent = last ? '整個題庫 340 首、六道門檻,你一關都沒有掉。' : '';
  $('st-facts').innerHTML  = stageFacts(st, true);
  $('btn-stage-go').hidden = last;
  $('btn-stage-go').textContent = last ? '' : `進入第 ${G.stage + 1} 關`;
  $('btn-stage-quit').textContent = last ? '回到首頁' : '先不玩了';

  // 重新觸發動畫:先拿掉再強制 reflow,不然連過兩關第二次不會動
  pop.hidden = false;
  pop.classList.remove('in');
  void pop.offsetWidth;
  pop.classList.add('in');
  (last ? $('btn-stage-quit') : $('btn-stage-go')).focus({ preventScroll: true });
}

function closePop(){
  const pop = $('pop');
  pop.classList.remove('in');
  pop.hidden = true;
}

/* 沒過門檻 —— 用結算畫面,但講的是「闖到第幾關」,不是分數。
   分享出去的那句話是「我闖到第 3 關」,所以那句要在最上面。 */
function failStage(st){
  closePop();
  // 闖關的「再玩一次」直接從第 1 關重開
  $('btn-again').textContent = '再闖一次';
  const cleared = G.stage - 1;
  const gap = st.need - G.total;
  $('res-title').textContent = cleared > 0 ? `闖到第 ${cleared} 關` : '第 1 關就卡住了';
  $('res-line').textContent  = cleared > 0
    ? `倒在第 ${G.stage} 關的 ${st.need.toLocaleString()} 分門檻前`
    : '第一關只考華語,再來一次一定過得了';
  $('res-score').textContent = G.total.toLocaleString();
  $('res-meta').textContent  =
    `第 ${G.stage} 關要 ${st.need.toLocaleString()} 分 · 差 ${gap.toLocaleString()} 分` +
    ` · 最佳紀錄 第 ${Store.bestStage()} 關`;

  const nextEl = $('res-next');
  nextEl.innerHTML = `再玩一次會<b>從第 1 關重新開始</b>`;
  nextEl.hidden = false;

  const missed = G.log.filter(r => !r.correct);
  $('res-misses').innerHTML = missed.length
    ? `<h4>沒答出來的</h4><ul>${missed.map(r =>
        `<li><b>${r.song.title}</b><span>${r.song.artist}</span></li>`).join('')}</ul>`
    : `<h4>全對</h4><div class="none">十題全中,但門檻是看分數的 —— 再快一點</div>`;

  show('screen-result');
}

$('btn-stage-go').addEventListener('click', () => { closePop(); G.stage++; playRound(); });
$('btn-stage-quit').addEventListener('click', () => { closePop(); show('screen-start'); });

/* ---------- 電腦測試用:按 1–9 作答 ---------- */
document.addEventListener('keydown', e => {
  if($('screen-play').hidden || G.locked) return;
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= 9){
    const el = $('grid').children[n-1];
    if(el) el.click();
  }
});

/* ---------- 啟動 ---------- */
setVolume(volume);   // 把記住的音量套到滑桿與圖示上
refreshStartBtn();
</script>
